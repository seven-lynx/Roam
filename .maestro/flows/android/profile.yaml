# Screenshot flow: Profile (Settings Hub -> account).
appId: app.roam.android
---
- launchApp:
    clearState: false
- startRecording: android-profile
- extendedWaitUntil:
    visible: "Settings"
    timeout: 30000
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "account"
    timeout: 10000
- tapOn: "account"
- extendedWaitUntil:
    visible: "Profile"
    timeout: 10000
- takeScreenshot: android-profile
- stopRecording
