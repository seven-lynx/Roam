# Screenshot flow: Browser settings (Settings Hub -> Net // Browser).
# NOTE: row label is the ROAM-OS flavour; classic theme uses "Browser".
appId: app.roam.android
---
- launchApp:
    clearState: false
- startRecording: android-browser
- extendedWaitUntil:
    visible: "Settings"
    timeout: 30000
- tapOn: "Settings"
- scrollUntilVisible:
    element:
      text: "Net // Browser"
    direction: DOWN
    timeout: 20000
- tapOn: "Net // Browser"
- waitForAnimationToEnd
- takeScreenshot: android-browser
- stopRecording
