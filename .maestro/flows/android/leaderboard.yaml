# Screenshot flow: Leaderboard (Settings Hub -> rankings).
appId: app.roam.android
---
- launchApp:
    clearState: false
- startRecording: android-leaderboard
- extendedWaitUntil:
    visible: "Settings"
    timeout: 30000
- tapOn: "Settings"
- scrollUntilVisible:
    element:
      text: "rankings"
    direction: DOWN
    timeout: 20000
- tapOn: "rankings"
- waitForAnimationToEnd
- takeScreenshot: android-leaderboard
- stopRecording
