# Screenshot flow: Leaderboard (Settings Hub -> rankings).
appId: app.roam.android
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Settings"
    timeout: 30000
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "rankings"
    timeout: 10000
- tapOn: "rankings"
- waitForAnimationToEnd
- takeScreenshot: android-leaderboard
