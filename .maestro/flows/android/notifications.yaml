# Screenshot flow: Notifications (Settings Hub -> alerts).
appId: app.roam.android
---
- launchApp:
    clearState: false
- startRecording: android-notifications
- extendedWaitUntil:
    visible: "Settings"
    timeout: 30000
- tapOn: "Settings"
- scrollUntilVisible:
    element:
      text: "alerts"
    direction: DOWN
    timeout: 20000
- tapOn: "alerts"
- waitForAnimationToEnd
- takeScreenshot: android-notifications
- stopRecording
