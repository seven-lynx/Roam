# Screenshot flow: Badges (Settings Hub -> Badges).
appId: app.roam.android
---
- launchApp:
    clearState: false
- startRecording: android-badges
- extendedWaitUntil:
    visible: "Settings"
    timeout: 30000
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Badges"
    timeout: 10000
- tapOn: "Badges"
- waitForAnimationToEnd
- takeScreenshot: android-badges
- stopRecording
