# Screenshot flow: Activity Feed (Settings Hub -> stream).
appId: app.roam.android
---
- launchApp:
    clearState: false
- startRecording: android-activity-feed
- extendedWaitUntil:
    visible: "Settings"
    timeout: 30000
- tapOn: "Settings"
- scrollUntilVisible:
    element:
      text: "stream"
    direction: DOWN
    timeout: 20000
- tapOn: "stream"
- waitForAnimationToEnd
- takeScreenshot: android-activity-feed
- stopRecording
