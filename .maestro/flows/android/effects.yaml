# Screenshot flow: Notifications & Effects (Settings Hub -> Sensory // Feedback).
# NOTE: row label is the ROAM-OS flavour; classic theme uses "Notifications & Effects".
appId: app.roam.android
---
- launchApp:
    clearState: false
- startRecording: android-effects
- extendedWaitUntil:
    visible: "Settings"
    timeout: 30000
- tapOn: "Settings"
- scrollUntilVisible:
    element:
      text: "Sensory // Feedback"
    direction: DOWN
    timeout: 20000
- tapOn: "Sensory // Feedback"
- waitForAnimationToEnd
- takeScreenshot: android-effects
- stopRecording
