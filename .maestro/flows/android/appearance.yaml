# Screenshot flow: Appearance (Settings Hub -> Display // Optics).
# NOTE: row label is the ROAM-OS flavour; classic theme uses "Appearance".
appId: app.roam.android
---
- launchApp:
    clearState: false
- startRecording: android-appearance
- extendedWaitUntil:
    visible: "Settings"
    timeout: 30000
- tapOn: "Settings"
- scrollUntilVisible:
    element:
      text: "Display // Optics"
    direction: DOWN
    timeout: 20000
- tapOn: "Display // Optics"
- waitForAnimationToEnd
- takeScreenshot: android-appearance
- stopRecording
