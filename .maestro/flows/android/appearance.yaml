# Screenshot flow: Appearance (Settings Hub -> Display // Optics).
# NOTE: row label is the ROAM-OS flavour; classic theme uses "Appearance".
appId: app.roam.android
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Settings"
    timeout: 30000
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Display // Optics"
    timeout: 10000
- tapOn: "Display // Optics"
- waitForAnimationToEnd
- takeScreenshot: android-appearance
