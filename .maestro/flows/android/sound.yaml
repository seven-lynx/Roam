# Screenshot flow: Sound (Settings Hub -> Audio // Channels).
# NOTE: row label is the ROAM-OS flavour; classic theme uses "Sound".
appId: app.roam.android
---
- launchApp:
    clearState: false
- startRecording: android-sound
- extendedWaitUntil:
    visible: "Settings"
    timeout: 30000
- tapOn: "Settings"
- scrollUntilVisible:
    element:
      text: "Audio // Channels"
    direction: DOWN
    timeout: 20000
- tapOn: "Audio // Channels"
- waitForAnimationToEnd
- takeScreenshot: android-sound
- stopRecording
