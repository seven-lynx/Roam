# Screenshot flow: Sound (Settings Hub -> Audio // Channels).
# NOTE: row label is the ROAM-OS flavour; classic theme uses "Sound".
appId: app.roam.android
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Settings"
    timeout: 30000
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Audio // Channels"
    timeout: 10000
- tapOn: "Audio // Channels"
- waitForAnimationToEnd
- takeScreenshot: android-sound
