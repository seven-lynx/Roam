# Screenshot flow: Challenges (Settings Hub -> quests).
appId: app.roam.android
---
- launchApp:
    clearState: false
- startRecording: android-challenges
- extendedWaitUntil:
    visible: "Settings"
    timeout: 30000
- tapOn: "Settings"
- scrollUntilVisible:
    element:
      text: "quests"
    direction: DOWN
    timeout: 20000
- tapOn: "quests"
- waitForAnimationToEnd
- takeScreenshot: android-challenges
- stopRecording
