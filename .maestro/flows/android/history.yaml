# Screenshot flow: History (Settings Hub -> log).
appId: app.roam.android
---
- launchApp:
    clearState: false
- startRecording: android-history
- extendedWaitUntil:
    visible: "Settings"
    timeout: 30000
- tapOn: "Settings"
- scrollUntilVisible:
    element:
      text: "log"
    direction: DOWN
    timeout: 20000
- tapOn: "log"
- waitForAnimationToEnd
- takeScreenshot: android-history
- stopRecording
