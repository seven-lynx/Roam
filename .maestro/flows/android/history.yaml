# Screenshot flow: History (Settings Hub -> log).
appId: app.roam.android
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Settings"
    timeout: 30000
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "log"
    timeout: 10000
- tapOn: "log"
- waitForAnimationToEnd
- takeScreenshot: android-history
