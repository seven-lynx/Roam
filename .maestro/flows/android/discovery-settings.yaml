# Screenshot flow: Discovery settings (Settings Hub -> Scan // Discovery).
# NOTE: row label is the ROAM-OS flavour; classic theme uses "Discovery".
appId: app.roam.android
---
- launchApp:
    clearState: false
- startRecording: android-discovery-settings
- extendedWaitUntil:
    visible: "Settings"
    timeout: 30000
- tapOn: "Settings"
- scrollUntilVisible:
    element:
      text: "Scan // Discovery"
    direction: DOWN
    timeout: 20000
- tapOn: "Scan // Discovery"
- waitForAnimationToEnd
- takeScreenshot: android-discovery-settings
- stopRecording
