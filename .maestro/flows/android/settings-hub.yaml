# Screenshot flow: Settings Hub.
appId: app.roam.android
---
- launchApp:
    clearState: false
- startRecording: android-settings-hub
- extendedWaitUntil:
    visible: "Settings"
    timeout: 30000
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "account"
    timeout: 10000
- takeScreenshot: android-settings-hub
- stopRecording
