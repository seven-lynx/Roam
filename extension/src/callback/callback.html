<!DOCTYPE html>
<html lang="en" data-theme="roam-os">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roam — Signing in...</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    /* Palette and fonts come from theme.css (ROAM-OS). Deliberately no CRT
       layers here: this page opens as a full browser tab, and the extension's
       effects stay inside the popup. */
    body {
      font-family: var(--font-ui);
      background:
        radial-gradient(900px 500px at 50% -10%, rgba(89, 179, 174, 0.07), transparent 70%),
        var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      color-scheme: dark;
    }
    .container {
      text-align: center;
      max-width: 320px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 2px solid var(--border);
      border-top-color: var(--phosphor);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin: 0 auto 1.5rem;
      box-shadow: 0 0 12px var(--phosphor-glow);
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-family: var(--font-mono);
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.75rem;
    }
    p {
      color: var(--text-muted);
      font-size: 0.85rem;
      line-height: 1.5;
    }
    .error {
      background: var(--danger-soft);
      border: 1px solid var(--danger-line);
      color: var(--text);
      padding: 0.85rem;
      border-radius: var(--radius-sm);
      margin-top: 1rem;
      display: none;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      line-height: 1.5;
    }
    .error.show {
      display: block;
    }
    .close-btn {
      display: none;
      margin-top: 1.5rem;
      padding: 0.7rem 1.4rem;
      background: var(--accent);
      color: var(--accent-ink);
      border: 1px solid var(--accent-hover);
      border-radius: var(--radius-sm);
      font-family: var(--font-mono);
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 600;
      cursor: pointer;
    }
    .close-btn:hover {
      background: var(--accent-hover);
    }
    .close-btn.show {
      display: inline-block;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner" id="spinner"></div>
    <h1>Signing in...</h1>
    <p>Completing your Google sign-in. This tab will close automatically.</p>
    <div class="error" id="error"></div>
    <button class="close-btn" id="closeBtn">Close tab</button>
  </div>
  <script src="callback.js"></script>
</body>
</html>
