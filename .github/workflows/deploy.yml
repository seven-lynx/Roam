name: Deploy Supabase Migrations & Functions

# Supabase-only deployment. The web app deploys via Vercel's own
# push-to-main integration; the extension and Android app ship through the
# Chrome Web Store / Firefox AMO / Google Play (manual or a separate release
# workflow). This workflow deliberately has NO push/commit-message triggers —
# see Hard Rule 1.1 (the `[deploy]` tag caused multiple production incidents).
#
# To run: Actions -> "Deploy Supabase Migrations & Functions" -> Run workflow.
# The `production` environment enforces required reviewers before dispatch.

on:
  workflow_dispatch:
    inputs:
      deploy_functions:
        description: 'Deploy Edge Functions (all)'
        type: boolean
        default: true
        required: true
      include_all:
        description: 'Force-push migrations with --include-all'
        type: boolean
        default: false
        required: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Supabase
    runs-on: ubuntu-24.04
    environment: production
    # Never cancel an in-flight database deploy (Hard Rule 6.4).
    concurrency:
      group: deploy-supabase
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: '10'

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Link using a personal-access token (preferred over --password: the
      # CLI's pgx driver cannot authenticate DB passwords containing
      # URL-special characters — see RUNBOOK.md 28P01 entry).
      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"

      # ── Pre-deploy gates ─────────────────────────────────────────────────
      # Each gate is a lesson learned from a past outage. Do not reorder.
      - name: Type-check each Edge Function in isolation
        # Every function is type-checked on its own, the way it is deployed. The
        # aggregate `deno check supabase/functions/**/*.ts` glob used to hide
        # failures that only appear per function — a shared helper that resolves
        # because a sibling function happened to be in the same program passes
        # the glob and breaks at deploy time. Keep this block identical to the
        # CI gate in ci.yml.
        #
        # Transient esm.sh 522s are retried once before failing. The retry is
        # intentionally narrow (one attempt) so a real type error doesn't get
        # masked by 30s of sleeps.
        run: |
          set -uo pipefail
          failed=""
          for fn in supabase/functions/*/index.ts; do
            log="/tmp/deno-$(basename "$(dirname "$fn")").log"
            deno check "$fn" > "$log" 2>&1 || failed="$failed $fn"
          done
          # _shared has no import graph of its own, so check it as one program.
          deno check supabase/functions/_shared/*.ts > /tmp/deno-shared.log 2>&1 \
            || failed="$failed _shared"
          if [ -n "$failed" ] && grep -lq '522\|error sending request\|connection reset\|tls handshake' /tmp/deno-*.log; then
            echo "Transient network error; retrying failed checks once after 10s."
            sleep 10
            retried=""
            for fn in $failed; do
              if [ "$fn" = "_shared" ]; then
                deno check supabase/functions/_shared/*.ts > /tmp/deno-shared.log 2>&1 || retried="$retried _shared"
              else
                deno check "$fn" > "/tmp/deno-$(basename "$(dirname "$fn")").log" 2>&1 || retried="$retried $fn"
              fi
            done
            failed="$retried"
          fi
          if [ -z "$failed" ]; then
            echo "deno check passed for all edge functions."
            exit 0
          fi
          for fn in $failed; do
            if [ "$fn" = "_shared" ]; then log=/tmp/deno-shared.log; else log="/tmp/deno-$(basename "$(dirname "$fn")").log"; fi
            echo "::error::deno check failed: $fn"
            echo "::group::$fn"
            cat "$log"
            echo "::endgroup::"
          done
          exit 1
        env:
          DENO_DIR: ~/.cache/deno

      - name: Preview migrations (dry-run)
        run: supabase db push --dry-run

      # Executes roam() for real under the `authenticated` role's 8s timeout.
      # This is the gate that caught the Aug 2026 42P01 outage that was
      # invisible in Sentry (Hard Rule 1.6).
      - name: Verify roam() RPC under authenticated role
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: node scripts/verify-roam-rpc.mjs

      # ── Deploy ───────────────────────────────────────────────────────────
      - name: Apply migrations
        run: |
          if [ "${{ inputs.include_all }}" = "true" ]; then
            supabase db push --include-all
          else
            supabase db push
          fi

      - name: Deploy Edge Functions
        if: inputs.deploy_functions
        run: supabase functions deploy

      # ── Post-deploy verification ─────────────────────────────────────────
      - name: Poll roam-health-check until green
        # SUPABASE_SERVICE_ROLE_KEY is not provisioned in GitHub Actions. The
        # roam() RPC gate above already exercises the function end-to-end via
        # the Management API, so this check degrades to a graceful skip rather
        # than failing the deploy for a secret that is intentionally absent.
        # If the secret is ever added, the health check runs automatically.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "::warning::SUPABASE_SERVICE_ROLE_KEY not set in Actions; skipping health-check (roam() RPC gate already passed)."
            exit 0
          fi
          if [ -z "${SUPABASE_URL}" ]; then
            echo "::error::SUPABASE_URL is empty; cannot poll roam-health-check."
            exit 1
          fi
          endpoint="${SUPABASE_URL}/functions/v1/roam-health-check"
          for i in $(seq 1 12); do
            status=$(curl -s -o /dev/null -w '%{http_code}' \
              -X POST "$endpoint" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}")
            if [ "$status" = "200" ]; then
              echo "roam-health-check green"
              exit 0
            fi
            echo "roam-health-check not ready (HTTP $status); retrying in 10s..."
            sleep 10
          done
          echo "::error::roam-health-check did not pass within 2 minutes"
          exit 1
