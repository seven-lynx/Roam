name: secrets-scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: secrets-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  betterleaks:
    name: Betterleaks secrets scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Betterleaks
        uses: betterleaks/betterleaks-action@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --redact --no-banner
          uploadSarif: true
