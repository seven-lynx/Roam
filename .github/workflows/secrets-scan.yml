name: secrets-scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: secrets-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  betterleaks:
    name: Betterleaks secrets scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Betterleaks
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            ghcr.io/betterleaks/betterleaks:v2.0.0-rc.2 \
            fs . --config .betterleaks.toml --redact
