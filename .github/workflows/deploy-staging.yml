name: Deploy Supabase (Staging)

# Staging counterpart to deploy.yml. Deploys migrations + Edge Functions to a
# separate staging Supabase project so a fix can be validated before the
# production workflow runs. No commit-message triggers (Hard Rule 1.1).
#
# To run: Actions -> "Deploy Supabase (Staging)" -> Run workflow (pick the
# branch). The `staging` GitHub environment has NO required reviewers, so the
# agent workflow may dispatch it programmatically; production keeps reviewers.

on:
  workflow_dispatch:
    inputs:
      deploy_functions:
        description: 'Deploy Edge Functions (all)'
        type: boolean
        default: true
        required: true
      include_all:
        description: 'Force-push migrations with --include-all'
        type: boolean
        default: false
        required: false
      verify_rpc:
        description: 'Run roam() RPC + health-check verification (requires a seeded staging DB)'
        type: boolean
        default: false
        required: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Supabase (Staging)
    runs-on: ubuntu-24.04
    environment: staging
    concurrency:
      group: deploy-supabase-staging
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Staging is opt-in infra: fail fast with an actionable message instead
      # of letting the CLI error out later on an empty --project-ref.
      - name: Verify staging project is provisioned
        env:
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
        run: |
          missing=""
          [ -z "${STAGING_SUPABASE_PROJECT_REF}" ] && missing="vars.STAGING_SUPABASE_PROJECT_REF"
          [ -z "${STAGING_SUPABASE_ACCESS_TOKEN}" ] && missing="${missing}${missing:+ }secrets.STAGING_SUPABASE_ACCESS_TOKEN"
          if [ -n "${missing}" ]; then
            echo "::error::Staging Supabase is not provisioned. Missing: ${missing}"
            echo "::error::Provision a staging Supabase project, then set the repository variable/secret listed above and re-run."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: '10'

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link staging Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref "${{ vars.STAGING_SUPABASE_PROJECT_REF }}"

      # ── Pre-deploy gates ─────────────────────────────────────────────────
      - name: Type-check each Edge Function in isolation
        # Every function is type-checked on its own, the way it is deployed. The
        # aggregate `deno check supabase/functions/**/*.ts` glob used to hide
        # failures that only appear per function — a shared helper that resolves
        # because a sibling function happened to be in the same program passes
        # the glob and breaks at deploy time. Keep this block identical to the
        # CI gate in ci.yml.
        #
        # Transient esm.sh 522s are retried once before failing. The retry is
        # intentionally narrow (one attempt) so a real type error doesn't get
        # masked by 30s of sleeps.
        run: |
          set -uo pipefail
          failed=""
          for fn in supabase/functions/*/index.ts; do
            log="/tmp/deno-$(basename "$(dirname "$fn")").log"
            deno check "$fn" > "$log" 2>&1 || failed="$failed $fn"
          done
          # _shared has no import graph of its own, so check it as one program.
          deno check supabase/functions/_shared/*.ts > /tmp/deno-shared.log 2>&1 \
            || failed="$failed _shared"
          if [ -n "$failed" ] && grep -lq '522\|error sending request\|connection reset\|tls handshake' /tmp/deno-*.log; then
            echo "Transient network error; retrying failed checks once after 10s."
            sleep 10
            retried=""
            for fn in $failed; do
              if [ "$fn" = "_shared" ]; then
                deno check supabase/functions/_shared/*.ts > /tmp/deno-shared.log 2>&1 || retried="$retried _shared"
              else
                deno check "$fn" > "/tmp/deno-$(basename "$(dirname "$fn")").log" 2>&1 || retried="$retried $fn"
              fi
            done
            failed="$retried"
          fi
          if [ -z "$failed" ]; then
            echo "deno check passed for all edge functions."
            exit 0
          fi
          for fn in $failed; do
            if [ "$fn" = "_shared" ]; then log=/tmp/deno-shared.log; else log="/tmp/deno-$(basename "$(dirname "$fn")").log"; fi
            echo "::error::deno check failed: $fn"
            echo "::group::$fn"
            cat "$log"
            echo "::endgroup::"
          done
          exit 1
        env:
          DENO_DIR: ~/.cache/deno

      - name: Preview migrations (dry-run)
        run: supabase db push --dry-run

      # Executes roam() under the authenticated role's 8s timeout. Skipped by
      # default until staging is seeded with a test user + URLs; enable via the
      # `verify_rpc` input (Hard Rule 1.6).
      - name: Verify roam() RPC under authenticated role
        if: inputs.verify_rpc
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
        run: |
          if [ -n "${{ vars.STAGING_ROAM_TEST_USER_ID }}" ]; then
            node scripts/verify-roam-rpc.mjs --user "${{ vars.STAGING_ROAM_TEST_USER_ID }}"
          else
            node scripts/verify-roam-rpc.mjs
          fi

      # ── Deploy ───────────────────────────────────────────────────────────
      - name: Apply migrations
        run: |
          if [ "${{ inputs.include_all }}" = "true" ]; then
            supabase db push --include-all --yes
          else
            supabase db push --yes
          fi

      - name: Deploy Edge Functions
        if: inputs.deploy_functions
        run: supabase functions deploy

      # ── Post-deploy verification ─────────────────────────────────────────
      - name: Poll roam-health-check until green
        if: inputs.verify_rpc
        env:
          SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          endpoint="${SUPABASE_URL}/functions/v1/roam-health-check"
          for i in $(seq 1 12); do
            status=$(curl -s -o /dev/null -w '%{http_code}' \
              -X POST "$endpoint" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}")
            if [ "$status" = "200" ]; then
              echo "roam-health-check green"
              exit 0
            fi
            echo "roam-health-check not ready (HTTP $status); retrying in 10s..."
            sleep 10
          done
          echo "::error::roam-health-check did not pass within 2 minutes"
          exit 1
