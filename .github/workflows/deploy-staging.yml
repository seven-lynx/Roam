name: Deploy Supabase (Staging)

# Staging counterpart to deploy.yml. Deploys migrations + Edge Functions to a
# separate staging Supabase project so a fix can be validated before the
# production workflow runs. No commit-message triggers (Hard Rule 1.1).
#
# To run: Actions -> "Deploy Supabase (Staging)" -> Run workflow (pick the
# branch). The `staging` GitHub environment has NO required reviewers, so the
# agent workflow may dispatch it programmatically; production keeps reviewers.

on:
  workflow_dispatch:
    inputs:
      deploy_functions:
        description: 'Deploy Edge Functions (all)'
        type: boolean
        default: true
        required: true
      include_all:
        description: 'Force-push migrations with --include-all'
        type: boolean
        default: false
        required: false
      verify_rpc:
        description: 'Run roam() RPC + health-check verification (requires a seeded staging DB)'
        type: boolean
        default: false
        required: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Supabase (Staging)
    runs-on: ubuntu-24.04
    environment: staging
    concurrency:
      group: deploy-supabase-staging
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: '10'

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link staging Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref "${{ vars.STAGING_SUPABASE_PROJECT_REF }}"

      # ── Pre-deploy gates ─────────────────────────────────────────────────
      - name: Type-check Edge Functions
        run: deno check supabase/functions/**/*.ts

      - name: Preview migrations (dry-run)
        run: supabase db push --dry-run

      # Executes roam() under the authenticated role's 8s timeout. Skipped by
      # default until staging is seeded with a test user + URLs; enable via the
      # `verify_rpc` input (Hard Rule 1.6).
      - name: Verify roam() RPC under authenticated role
        if: inputs.verify_rpc
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
        run: |
          if [ -n "${{ vars.STAGING_ROAM_TEST_USER_ID }}" ]; then
            node scripts/verify-roam-rpc.mjs --user "${{ vars.STAGING_ROAM_TEST_USER_ID }}"
          else
            node scripts/verify-roam-rpc.mjs
          fi

      # ── Deploy ───────────────────────────────────────────────────────────
      - name: Apply migrations
        run: |
          if [ "${{ inputs.include_all }}" = "true" ]; then
            supabase db push --include-all --yes
          else
            supabase db push --yes
          fi

      - name: Deploy Edge Functions
        if: inputs.deploy_functions
        run: supabase functions deploy

      # ── Post-deploy verification ─────────────────────────────────────────
      - name: Poll roam-health-check until green
        if: inputs.verify_rpc
        env:
          SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          endpoint="${SUPABASE_URL}/functions/v1/roam-health-check"
          for i in $(seq 1 12); do
            status=$(curl -s -o /dev/null -w '%{http_code}' \
              -X POST "$endpoint" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}")
            if [ "$status" = "200" ]; then
              echo "roam-health-check green"
              exit 0
            fi
            echo "roam-health-check not ready (HTTP $status); retrying in 10s..."
            sleep 10
          done
          echo "::error::roam-health-check did not pass within 2 minutes"
          exit 1
