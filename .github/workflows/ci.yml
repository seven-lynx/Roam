name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Concurrency groups below cancel superseded runs on push so we don't pay
# minutes for commits that have been replaced by newer ones on the same branch.
# PR runs use a PR-number key so a review-time re-run doesn't kill the
# under-review run. The single biggest minutes-saver on a free-tier Actions
# budget: without it, every `git commit --amend` or `git push --force` starts
# a fresh runner, runs the full job, and burns the same minutes again.

jobs:
  changed-paths:
    name: Detect changed paths (used for build optimisation)
    runs-on: ubuntu-24.04
    outputs:
      web: ${{ steps.filter.outputs.web }}
      extension: ${{ steps.filter.outputs.extension }}
      android: ${{ steps.filter.outputs.android }}
      supabase: ${{ steps.filter.outputs.supabase }}
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: filter
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filters: |
            web:
              - 'web/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
            extension:
              - 'extension/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
            android:
              - 'android/**'
            supabase:
              - 'supabase/migrations/**'
              - 'supabase/functions/**'
            migrations:
              - 'supabase/migrations/**'
              - 'supabase/config.toml'

  # Replay the entire migration history against a scratch database. Without this
  # a migration that only works on an already-migrated project passes CI and
  # fails for every new contributor. Issue #50: 20261103000001_roll_badges.sql
  # seeded a category the June CHECK rejected, because the file had been edited
  # AFTER it was applied (651668a). Content edits to applied migrations are
  # invisible to `db push --dry-run` and to check-migrations.mjs (both compare
  # version numbers, not file contents), so only a full replay catches them.
  supabase-migrations:
    name: Validate Migrations
    needs: changed-paths
    if: needs.changed-paths.outputs.migrations == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: supabase-migrations-${{ github.ref }}-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5

      # Pinned, not `latest`: the v3 major changed `db push`'s default target and
      # rejects the old `[inbucket]` config section (same pin as deploy.yml).
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.0.0

      - name: Replay all migrations against a scratch database
        # --no-seed is explicit rather than load-bearing: config.toml points
        # [db.seed] at ./seed.sql, which does not exist, so seeding is a no-op
        # either way.
        run: |
          supabase start
          supabase db reset --local --no-seed

  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-24.04
    # Cancel superseded runs on the same branch/ref so amended commits don't
    # pay minutes for older code. PRs get their own concurrency key so a
    # review-time re-run doesn't kill the under-review run.
    concurrency:
      group: lint-and-test-${{ github.ref }}-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm modules
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Web layer
      - name: Lint web
        working-directory: ./web
        run: pnpm lint

      - name: Type check web
        working-directory: ./web
        run: pnpm tsc --noEmit

      - name: Test web
        working-directory: ./web
        run: pnpm test:ci

      # Extension layer
      - name: Lint extension
        working-directory: ./extension
        run: pnpm lint || echo "No linter configured yet"

      - name: Build extension
        working-directory: ./extension
        run: pnpm build
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://ci-build-placeholder.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci-build-placeholder-anon-key-for-bundling-only' }}

      - name: Test extension
        working-directory: ./extension
        run: pnpm test

      # Supabase layer
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cache Deno dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/deno
          key: deno-${{ hashFiles('supabase/functions/**/*.ts') }}
          restore-keys: deno-

      # Filter to edge-function source changes only. The `contains(fromJSON([...]))`
      # pattern that lived here earlier always evaluated to false (the `contains()`
      # helper does element matching on arrays, not glob matching) and silently
      # disabled this step on every PR. Using dorny/paths-filter does actual
      # glob matching and runs deno check only when an edge function source file
      # is touched. Tests under _tests/ are excluded from `edge` so a test-only
      # PR skips the type check, and included in `tests` so it still runs the
      # suite below.
      - name: Detect changes in edge function source
        id: edge-fn-changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        with:
          # token-only filter; default branch protection must allow this token.
          # Workflow path-filter rule: token-based (see dorny/paths-filter).
          token: ${{ secrets.GITHUB_TOKEN }}
          # Globs, not a hand-maintained list: the previous 28-entry list had
          # silently dropped four functions (cron-notification-cleanup,
          # game-action, roll-action, sentry-webhook), so PRs touching only
          # those never ran the type check at all.
          #
          # An exclusion only wins over an inclusion with 'some-with-excludes';
          # under the default 'some' any file matching any pattern counts as
          # matched, so supabase/functions/_tests/** would still trigger the gate.
          predicate-quantifier: 'some-with-excludes'
          filters: |
            edge:
              - 'supabase/functions/**'
              - '!supabase/functions/_tests/**'
              - 'deno.json'
            tests:
              - 'supabase/functions/**'
              - 'deno.json'

      - name: Type-check each Edge Function in isolation
        if: steps.edge-fn-changes.outputs.edge == 'true'
        # Every function is type-checked on its own, the way it is deployed. A
        # shared helper that only resolves because a sibling function happened
        # to be in the same program fails here — which is exactly how the
        # `EdgeRuntime` global stayed invisible to `deno check <one function>`.
        #
        # Transient esm.sh 522s are retried once before failing. The retry is
        # intentionally narrow (one attempt) so a real type error doesn't get
        # masked by 30s of sleeps.
        run: |
          set -uo pipefail
          failed=""
          for fn in supabase/functions/*/index.ts; do
            log="/tmp/deno-$(basename "$(dirname "$fn")").log"
            deno check "$fn" > "$log" 2>&1 || failed="$failed $fn"
          done
          # _shared has no import graph of its own, so check it as one program.
          deno check supabase/functions/_shared/*.ts > /tmp/deno-shared.log 2>&1 \
            || failed="$failed _shared"
          if [ -n "$failed" ] && grep -lq '522\|error sending request\|connection reset\|tls handshake' /tmp/deno-*.log; then
            echo "Transient network error; retrying failed checks once after 10s."
            sleep 10
            retried=""
            for fn in $failed; do
              if [ "$fn" = "_shared" ]; then
                deno check supabase/functions/_shared/*.ts > /tmp/deno-shared.log 2>&1 || retried="$retried _shared"
              else
                deno check "$fn" > "/tmp/deno-$(basename "$(dirname "$fn")").log" 2>&1 || retried="$retried $fn"
              fi
            done
            failed="$retried"
          fi
          if [ -z "$failed" ]; then
            echo "deno check passed for all edge functions."
            exit 0
          fi
          for fn in $failed; do
            if [ "$fn" = "_shared" ]; then log=/tmp/deno-shared.log; else log="/tmp/deno-$(basename "$(dirname "$fn")").log"; fi
            echo "::error::deno check failed: $fn"
            echo "::group::$fn"
            cat "$log"
            echo "::endgroup::"
          done
          exit 1
        env:
          DENO_DIR: ~/.cache/deno

      # `deno check` proves the functions compile, not that they behave, and
      # nothing ran the suites in _tests/ — which is how the sentry-webhook dedup
      # regression (#101) shipped green.
      #
      # --frozen-lockfile: the suites reach their asserts through the
      # `@std/assert` map in deno.json, so the dependency is pinned in the tracked
      # deno.lock. Frozen turns an unpinned or stale lock into a hard failure; the
      # old `--no-lock` skipped the lock entirely, which is how it drifted to
      # pinning nothing while eight files imported two different std versions.
      # No permission flags: the two live-DB suites (user_actions RLS, challenges
      # auto-populate) ignore themselves when SUPABASE_URL is unset, which is the
      # case here — they need `supabase start` and a seeded test user.
      - name: Test Edge Functions
        if: steps.edge-fn-changes.outputs.tests == 'true'
        run: deno test --frozen-lockfile supabase/functions/_tests/
        env:
          DENO_DIR: ~/.cache/deno

      # Scoped to the suites on purpose. Function source still carries ~87 findings
      # of its own (37 no-explicit-any, 30 no-import-prefix on the esm.sh imports
      # the runtime requires), so gating it is an import-map decision rather than a
      # cleanup. This step keeps the files that already failed once (#101) clean
      # and stops the backlog from growing.
      - name: Lint Edge Function tests
        if: steps.edge-fn-changes.outputs.tests == 'true'
        run: deno lint supabase/functions/_tests/

      # Android layer
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle distributions
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
          key: gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy 'tools' SDK package was removed by Google (see
          # android-actions/setup-android#537). Override the default
          # 'tools platform-tools' to install only what still exists.
          packages: platform-tools

      - name: Lint Android with Kotlin
        working-directory: ./android
        run: |
          if [ -f gradlew ] && [ -f app/google-services.json ]; then
            chmod +x gradlew
            ./gradlew lint
          else
            echo "Skipping Android lint: google-services.json is not committed (Firebase secret)."
          fi

      - name: Compile Android
        working-directory: ./android
        run: |
          if [ -f gradlew ] && [ -f app/google-services.json ]; then
            chmod +x gradlew
            ./gradlew compileDebugKotlin
          else
            echo "Skipping Android compile: google-services.json is not committed (Firebase secret)."
          fi

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./web/coverage/coverage-final.json
          fail_ci_if_error: false
          verbose: true

  build-web:
    name: Build Web for Deployment
    # Only build the web bundle when web/ changed AND we're pushing to main
    # (PR builds are wasteful since Vercel handles the production deploy).
    needs: [lint-and-test, changed-paths]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changed-paths.outputs.web == 'true'
    runs-on: ubuntu-24.04
    concurrency:
      group: build-web-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Next.js build cache
        # next/font/google downloads font assets during `pnpm build`; caching
        # web/.next/cache between runs avoids the transient "Failed to fetch
        # font from Google Fonts" flake seen in the Nov 2026 web-build run and
        # speeds up incremental builds.
        uses: actions/cache@v5
        with:
          path: web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('web/**/*.js', 'web/**/*.jsx', 'web/**/*.ts', 'web/**/*.tsx', 'web/**/*.css') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-

      - name: Build Next.js
        working-directory: ./web
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://ci-placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci-placeholder-anon-key' }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN || 'https://ci-placeholder@sentry.io/0' }}

      - name: Upload to Vercel (manual deploy step)
        run: |
          echo "Build successful. Deploy manually via Vercel dashboard or configure Vercel CI integration."
          echo "Artifact prepared: web/.next"

  build-extension:
    name: Build Extension for Stores
    # Only build the extension bundle when extension/ changed AND we're
    # pushing to main. PR builds are wasteful — the actual store release
    # happens via the deploy workflow on main.
    needs: [lint-and-test, changed-paths]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changed-paths.outputs.extension == 'true'
    runs-on: ubuntu-24.04
    concurrency:
      group: build-extension-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Chrome extension
        working-directory: ./extension
        run: pnpm build
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://ci-build-placeholder.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci-build-placeholder-anon-key-for-bundling-only' }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_EXTENSION }}

      - name: Build Firefox extension
        working-directory: ./extension
        run: pnpm build -- --firefox
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://ci-build-placeholder.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci-build-placeholder-anon-key-for-bundling-only' }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_EXTENSION }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extensions
          path: |
            extension/dist/
            extension/dist-firefox/

  security-scan:
    name: Security Scan
    # Scan PRs and pushes; cancel superseded runs. The job is gated on
    # pull_request only (pushes don't surface SARIF results, so running
    # this on push wastes minutes).
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    concurrency:
      group: security-scan-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: true
    # Without `security-events: write`, codeql-action/upload-sarif cannot write
    # to the GitHub Security tab even on same-repo PRs (the default token
    # permission is read-all, which does not include this scope). Fork PRs
    # additionally lack the scope regardless of the permission block, which is
    # why the upload-sarif step below has a fork-aware `if:` and a fallback
    # artifact upload for forks.
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run Trivy vulnerability scanner
        # Pinned to a commit SHA (was @master). Trivy-action updates its
        # bundled Trivy binary frequently, so audit the diff before bumping.
        # Current pin was the master tip as of 2026-08-14.
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        # github/codeql-action/upload-sarif requires 'security-events: write'.
        # Same-repo PRs have the scope (see job-level permissions above). Fork
        # PRs do not — the runner hits "Resource not accessible by integration"
        # when it tries to call the GitHub Security API. We skip the upload
        # for forks and fall back to uploading the SARIF as an artifact so
        # reviewers can still inspect it.
        if: github.event.pull_request.head.repo.fork == false
        # codeql-action @v4 releases are immutable; the major tag tracks the latest v4 patch.
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Upload Trivy SARIF as artifact (fork PRs)
        if: github.event.pull_request.head.repo.fork == true
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results-sarif
          path: trivy-results.sarif
          retention-days: 14

      - name: Check for hardcoded secrets
        # Pinned to a commit SHA (was @main). TruffleHog is a security tool
        # that must not float; bump only after reviewing detector changes.
        # Current pin was the main tip as of 2026-09-25.
        uses: trufflesecurity/trufflehog@88524578ce32e1a8521c29dd38af9d9200ff92cc
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: HEAD
          extra_args: --debug --only-verified