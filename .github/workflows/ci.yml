name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10'

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm modules
        uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install web dependencies
        working-directory: ./web
        run: pnpm install --frozen-lockfile

      - name: Install extension dependencies
        working-directory: ./extension
        run: pnpm install --frozen-lockfile

      - name: Install scripts dependencies
        working-directory: ./scripts
        run: pnpm install --frozen-lockfile

      # Web layer
      - name: Lint web
        working-directory: ./web
        run: pnpm lint

      - name: Type check web
        working-directory: ./web
        run: pnpm tsc --noEmit

      - name: Test web
        working-directory: ./web
        run: pnpm test:ci

      # Extension layer
      - name: Lint extension
        working-directory: ./extension
        run: pnpm lint || echo "No linter configured yet"

      - name: Build extension
        working-directory: ./extension
        run: pnpm build
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://ci-build-placeholder.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci-build-placeholder-anon-key-for-bundling-only' }}

      # Scripts layer
      - name: Lint scripts
        working-directory: ./scripts
        run: pnpm lint || echo "No linter configured yet"

      # Supabase layer
      - name: Lint Supabase functions
        run: |
          # Verify Edge Functions are syntactically valid (Deno check)
          echo "Deno type checking would run here (requires deno CLI)"
          echo "Skipped for now - verify manually or add deno to CI"

      # Android layer
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle distributions
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
          key: gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Lint Android with Kotlin
        working-directory: ./android
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew lint || true
          fi

      - name: Compile Android
        working-directory: ./android
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew compileDebugKotlin
          fi

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./web/coverage/coverage-final.json
          fail_ci_if_error: false
          verbose: true

  build-web:
    name: Build Web for Deployment
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        working-directory: ./web
        run: pnpm install --frozen-lockfile

      - name: Build Next.js
        working-directory: ./web
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://ci-placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci-placeholder-anon-key' }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN || 'https://ci-placeholder@sentry.io/0' }}

      - name: Upload to Vercel (manual deploy step)
        run: |
          echo "Build successful. Deploy manually via Vercel dashboard or configure Vercel CI integration."
          echo "Artifact prepared: web/.next"

  build-extension:
    name: Build Extension for Stores
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        working-directory: ./extension
        run: pnpm install --frozen-lockfile

      - name: Build Chrome extension
        working-directory: ./extension
        run: pnpm build
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://ci-build-placeholder.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci-build-placeholder-anon-key-for-bundling-only' }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_EXTENSION }}

      - name: Build Firefox extension
        working-directory: ./extension
        run: pnpm build -- --firefox
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://ci-build-placeholder.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci-build-placeholder-anon-key-for-bundling-only' }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_EXTENSION }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extensions
          path: |
            extension/dist/
            extension/dist-firefox/

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Check for hardcoded secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: HEAD
          extra_args: --debug --only-verified
